# Builds WRC9-LAN-Revival.exe on Windows. Runs by hand (Actions tab) or when a
# version tag like v1.0 is pushed; tags also publish the .exe as a GitHub Release.
name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.10.0

      - name: Build exe
        run: >
          pyinstaller --onefile --console --uac-admin
          --name WRC9-LAN-Revival
          --add-data "windows/ktos.pem;."
          windows/wrc9-ktos.py

      - uses: actions/upload-artifact@v4
        with:
          name: WRC9-LAN-Revival
          path: dist/WRC9-LAN-Revival.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WRC9-LAN-Revival.exe
